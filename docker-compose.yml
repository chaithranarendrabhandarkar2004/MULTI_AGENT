version: '3.8'
services:
  app:
    build: .
    container_name: support-rag-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/support_rag
      - JWT_SECRET=techmart_orchestrator_secret_key_2026
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb
    restart: always

  mongodb:
    image: mongo:latest
    container_name: support-rag-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data:
    driver: local
